<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MongoDB Dashboard</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Inter, "Segoe UI", Arial, sans-serif;
      }

      body {
        background: #0f172a;
        color: #f8fafc;
        min-height: 100vh;
        padding: 40px;
      }

      .container {
        max-width: 1300px;
        margin: auto;
        display: grid;
        grid-template-columns: 400px 1fr;
        gap: 30px;
      }

      .card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 18px;
        padding: 28px;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
      }

      h1 {
        font-size: 30px;
        margin-bottom: 10px;
      }

      h2 {
        margin-bottom: 20px;
      }

      .subtitle {
        color: #94a3b8;
        margin-bottom: 30px;
      }

      .input-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #cbd5e1;
        font-size: 14px;
      }

      input {
        width: 100%;
        padding: 14px;
        background: #0f172a;
        color: white;
        border: 1px solid #475569;
        border-radius: 10px;
        font-size: 15px;
        transition: 0.2s;
      }

      input:focus {
        outline: none;
        border-color: #3b82f6;
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
      }

      button {
        width: 100%;
        padding: 14px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 10px;
        cursor: pointer;
        font-size: 15px;
        font-weight: 600;
        transition: 0.2s;
      }

      button:hover {
        background: #1d4ed8;
      }

      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .spinner {
        display: none;
        margin: 20px auto 0;
        width: 22px;
        height: 22px;
        border: 3px solid rgba(255, 255, 255, 0.2);
        border-top: 3px solid white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      #message {
        display: none;
        margin-top: 20px;
        padding: 14px;
        border-radius: 10px;
        font-size: 14px;
      }

      .success {
        background: rgba(34, 197, 94, 0.15);
        color: #4ade80;
      }

      .error {
        background: rgba(239, 68, 68, 0.15);
        color: #f87171;
      }

      .records {
        display: flex;
        flex-direction: column;
        gap: 15px;
        max-height: 700px;
        overflow-y: auto;
      }

      .record {
        background: #0f172a;
        border: 1px solid #334155;
        border-radius: 12px;
        padding: 18px;
        transition: 0.2s;
      }

      .record:hover {
        border-color: #3b82f6;
      }

      .record-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 10px;
        gap: 15px;
      }

      .label {
        color: #94a3b8;
        font-size: 13px;
      }

      .value {
        font-weight: 600;
        margin-top: 3px;
      }

      .empty {
        text-align: center;
        color: #94a3b8;
        padding: 50px 20px;
      }

      @media (max-width: 900px) {
        body {
          padding: 20px;
        }

        .container {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <h1>MongoDB Dashboard</h1>
        <p class="subtitle">Submit user information to the backend.</p>

        <form id="userForm">
          <div class="input-group">
            <label>Name</label>
            <input id="name" type="text" placeholder="Enter name" required />
          </div>

          <div class="input-group">
            <label>Age</label>
            <input id="age" type="number" placeholder="Enter age" required />
          </div>

          <button id="submitBtn">Save Record</button>

          <div class="spinner" id="spinner"></div>
        </form>

        <div id="message"></div>
      </div>

      <div class="card">
        <h2>Stored Records</h2>

        <div class="records" id="records"></div>
      </div>
    </div>

    <script>
      const form = document.getElementById("userForm");
      const submitBtn = document.getElementById("submitBtn");
      const spinner = document.getElementById("spinner");
      const message = document.getElementById("message");
      const records = document.getElementById("records");

      async function loadRecords() {
        try {
          const res = await fetch("/api/data");
          const data = await res.json();

          if (!data.length) {
            records.innerHTML = `
                <div class="empty">
                    No records available.
                </div>
            `;

            return;
          }

          records.innerHTML = data
            .reverse()
            .map(
              (user) => `

            <div class="record">

                <div class="record-row">

                    <div>
                        <div class="label">Name</div>
                        <div class="value">${user.name}</div>
                    </div>

                    <div>
                        <div class="label">Age</div>
                        <div class="value">${user.age}</div>
                    </div>

                </div>

                <div class="record-row">

                    <div>
                        <div class="label">Backend</div>
                        <div class="value">${user.appName}</div>
                    </div>

                    <div>
                        <div class="label">Created</div>
                        <div class="value">
                            ${new Date(user.createdAt).toLocaleString()}
                        </div>
                    </div>

                </div>

            </div>

        `,
            )
            .join("");
        } catch {
          records.innerHTML = `
            <div class="empty">
                Unable to fetch records.
            </div>
        `;
        }
      }

      loadRecords();

      form.addEventListener("submit", async function (e) {
        e.preventDefault();

        submitBtn.disabled = true;
        spinner.style.display = "block";

        message.style.display = "none";

        try {
          const response = await fetch("/api/data", {
            method: "POST",

            headers: {
              "Content-Type": "application/json",
            },

            body: JSON.stringify({
              name: document.getElementById("name").value,
              age: Number(document.getElementById("age").value),
            }),
          });

          const json = await response.json();

          if (json.success) {
            message.className = "success";
            message.textContent = "Record saved successfully.";

            form.reset();

            loadRecords();
          } else {
            throw new Error(json.error);
          }
        } catch (err) {
          message.className = "error";
          message.textContent = err.message;
        }

        message.style.display = "block";

        spinner.style.display = "none";
        submitBtn.disabled = false;
      });
    </script>
  </body>
</html>
