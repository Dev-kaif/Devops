# apiVersion - which version of API server to be used
apiVersion: v1

# kind- Type of Manifestation is defined using this
kind: Pod # Pod type , its type Sensitive

# metadata about the node/containers
metadata:
  name: nginx

spec:
  # Under the specs we define our containers
  containers:
    - name: nginx
      image: nginx:1.14.2
      ports:
      # This container is listening on port 80.
        - containerPort: 80
    
